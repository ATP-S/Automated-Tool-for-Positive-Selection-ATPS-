[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atps"
version = "0.1.0"
description = "Automated Tool for Positive Selection - A bioinformatics pipeline for detecting positive selection in coding sequences"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Marwan", email = "mar.khaled@nu.edu.eg"},
    {name = "Youssef", email = "youssef@nu.edu.eg"}
]
keywords = [
    "bioinformatics",
    "positive-selection",
    "phylogenetics",
    "codeml",
    "paml",
    "molecular-evolution"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Core bioinformatics
    "biopython>=1.81",
    "bio>=1.5.6",
    "biothings-client>=0.2.6",
    "mygene>=3.2.2",
    # Scientific computing
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # Visualization
    "bokeh>=2.4",
    "panel>=0.14",
    "param>=1.12",
    "pyviz-comms>=2.2",
    "Pillow>=9.4",
    # Data formats
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "Markdown>=3.4",
    # Utilities
    "requests>=2.28",
    "tqdm>=4.65",
    "arrow>=1.2",
    "python-dateutil>=2.8",
    "configparser>=5.3",
    # Other dependencies
    "bleach>=6.0",
    "certifi>=2022.12",
    "charset-normalizer>=3.1",
    "contourpy>=1.0",
    "cycler>=0.11",
    "decorator>=5.1",
    "et-xmlfile>=1.1",
    "fonttools>=4.39",
    "glob2>=0.7",
    "gprofiler-official>=1.0",
    "idna>=3.4",
    "importlib-metadata>=6.0",
    "importlib-resources>=5.12",
    "kiwisolver>=1.4",
    "MarkupSafe>=2.1",
    "mne>=1.3",
    "packaging>=23.0",
    "platformdirs>=3.1",
    "pooch>=1.7",
    "pyct>=0.5",
    "PyMySQL>=1.0",
    "pyparsing>=3.0",
    "pytz>=2022.7",
    "six>=1.16",
    "tornado>=6.2",
    "typing_extensions>=4.5",
    "urllib3>=1.26",
    "webencodings>=0.5",
    "zipp>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
atps = "atps.cli:main"

[project.urls]
Homepage = "https://github.com/ATP-S/Automated-Tool-for-Positive-Selection-ATPS-"
Repository = "https://github.com/ATP-S/Automated-Tool-for-Positive-Selection-ATPS-"
Issues = "https://github.com/ATP-S/Automated-Tool-for-Positive-Selection-ATPS-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atps = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | \.eggs
  | jmodeltest-2\.1\.7
  | Gblocks_0\.91b
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "jmodeltest-2.1.7",
    "Gblocks_0.91b",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
